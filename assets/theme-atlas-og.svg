<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Theme Atlas Open Graph Image</title>
  <desc id="desc">A dark promotional image for Theme Atlas with colorful theme swatches and app preview panels.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop stop-color="#111318"/>
      <stop offset="0.55" stop-color="#15112b"/>
      <stop offset="1" stop-color="#071013"/>
    </linearGradient>
    <linearGradient id="accent" x1="140" y1="80" x2="980" y2="540" gradientUnits="userSpaceOnUse">
      <stop stop-color="#00f5d4"/>
      <stop offset="0.35" stop-color="#7aa2f7"/>
      <stop offset="0.7" stop-color="#ff2e88"/>
      <stop offset="1" stop-color="#fcee09"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18" result="blur"/>
      <feColorMatrix in="blur" values="0 0 0 0 0.22 0 0 0 0 0.62 0 0 0 0 1 0 0 0 0.5 0"/>
      <feBlend in="SourceGraphic"/>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <path d="M0 0h1200v630H0z" fill="none"/>
  <g opacity="0.24">
    <path d="M0 120h1200M0 240h1200M0 360h1200M0 480h1200" stroke="#445064"/>
    <path d="M120 0v630M240 0v630M360 0v630M480 0v630M600 0v630M720 0v630M840 0v630M960 0v630M1080 0v630" stroke="#445064"/>
  </g>
  <rect x="72" y="74" width="1056" height="482" rx="34" fill="#10151f" stroke="url(#accent)" stroke-width="4" filter="url(#softGlow)"/>
  <g transform="translate(118 128)">
    <rect width="86" height="86" rx="18" fill="#07090d" stroke="url(#accent)" stroke-width="3"/>
    <rect x="20" y="22" width="16" height="42" rx="4" fill="#00f5d4"/>
    <rect x="36" y="22" width="16" height="42" rx="4" fill="#7aa2f7"/>
    <rect x="52" y="22" width="16" height="42" rx="4" fill="#ff2e88"/>
    <circle cx="68" cy="68" r="6" fill="#fcee09"/>
  </g>
  <text x="118" y="270" fill="#f8fbff" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="86" font-weight="800">Theme Atlas</text>
  <text x="122" y="326" fill="#aeb6c2" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="30">Preview, organize, copy, and export reusable app color tokens.</text>
  <g transform="translate(122 390)">
    <rect width="150" height="54" rx="12" fill="#00f5d4"/>
    <text x="28" y="36" fill="#071013" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" font-weight="700">169 themes</text>
    <rect x="166" width="142" height="54" rx="12" fill="#24283b" stroke="#445064"/>
    <text x="198" y="36" fill="#c0caf5" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" font-weight="700">JSON</text>
    <rect x="324" width="150" height="54" rx="12" fill="#241b2f" stroke="#6d4f8f"/>
    <text x="354" y="36" fill="#ff7edb" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" font-weight="700">CSS vars</text>
  </g>
  <g transform="translate(720 140)">
    <rect width="322" height="318" rx="24" fill="#151922" stroke="#343944"/>
    <rect x="26" y="28" width="270" height="48" rx="10" fill="#1e1e2e"/>
    <rect x="46" y="44" width="96" height="16" rx="8" fill="#cba6f7"/>
    <rect x="26" y="100" width="82" height="150" rx="14" fill="#00f5d4"/>
    <rect x="120" y="100" width="82" height="150" rx="14" fill="#7aa2f7"/>
    <rect x="214" y="100" width="82" height="150" rx="14" fill="#ff2e88"/>
    <rect x="26" y="274" width="270" height="18" rx="9" fill="#fcee09"/>
